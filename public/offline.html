<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
    <title>Shoebox</title>
    <style>
      :root {
        --bg: #f2eee6;
        --ink: #211d17;
        --muted: #776f62;
        --print: #fffdf9;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15130f;
          --ink: #f0ebe1;
          --muted: #a39a8b;
          --print: #ece6da;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main {
        max-width: 300px;
      }
      .print {
        width: 120px;
        margin: 0 auto 28px;
        padding: 7px 7px 26px;
        background: var(--print);
        transform: rotate(-3deg);
        box-shadow: 0 1px 1px rgb(50 36 20 / 0.1), 0 8px 18px -8px rgb(50 36 20 / 0.4);
      }
      .print div {
        aspect-ratio: 4 / 5;
        background: #d9d2c4;
      }
      h1 {
        font-size: 21px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background: var(--ink);
        color: var(--bg);
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="print"><div></div></div>
      <h1>No connection</h1>
      <p>Shoebox needs the internet to open your boards. It'll pick up where you left off.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
